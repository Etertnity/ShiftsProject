# Раздача собранного фронтенда внутри контейнера. Снаружи запросы приходят только через nginx.prod.conf
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html не кэшируем: после обновления сайта браузер сразу получит ссылки на новые чанки
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # У файлов сборки в имени хэш — их можно кэшировать надолго
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Служебные файлы не отдаём
    location ~ /\. {
        deny all;
    }
}
