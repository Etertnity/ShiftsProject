# Входная точка продакшена: HTTPS, заголовки безопасности, ограничение частоты запросов.
# Сертификаты лежат в ./ssl (fullchain.pem и privkey.pem) — их готовит deploy-vps.sh.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;            # не раскрываем версию nginx
    client_max_body_size 10m;     # загрузка Excel-файлов; больше не нужно
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Подбор пароля: не больше 10 попыток входа в минуту с одного адреса (сервер дополнительно блокирует логин)
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    upstream frontend { server shift_management_frontend:80; }
    upstream backend  { server shift_management_backend:8000; }

    server {
        listen 80 default_server;
        server_name _;
        # Всё по HTTP — на HTTPS: пароль и токен не должны идти открытым текстом
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # --- Заголовки безопасности ---
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Скрипты, стили, шрифты и запросы — только с этого же сайта. Встроенные стили нужны анимациям
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # Общие заголовки для бэкенда. X-Forwarded-For — только реальный адрес клиента, подделать его нельзя
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Вход в систему — строгий лимит. /login без /api — это страница входа, она идёт во фронтенд
        location ~ ^/(api/token|api/login|token)$ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend;
        }

        # Документация API в продакшене закрыта и на уровне бэкенда, и здесь
        location ~ ^/(docs|redoc|openapi\.json) {
            return 404;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend;
        }

        # Проверка, что бэкенд жив (для мониторинга и deploy-vps.sh)
        location = /healthz {
            access_log off;
            proxy_pass http://backend/;
        }

        location / {
            proxy_pass http://frontend;
        }

        # Скрытые файлы (.env, .git) не отдаются ни при каких условиях
        location ~ /\. {
            deny all;
        }
    }
}
